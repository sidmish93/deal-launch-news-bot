name: ECM news

# ECM headlines run all week. Five minutes is the shortest interval GitHub
# Actions will run. The minutes avoid :00, when GitHub is most likely to drop
# a scheduled run. A public repository is not billed for the minutes.
on:
  schedule:
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 * * * *"
  workflow_dispatch:
    inputs:
      day:
        description: "Resend one IST day (YYYY-MM-DD). Empty runs a normal poll."
        required: false
        default: ""

concurrency:
  group: deal-news
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Poll deal feeds
        env:
          DEAL_BOT_TOKEN: ${{ secrets.DEAL_BOT_TOKEN }}
          DEAL_CHAT_ID: ${{ secrets.DEAL_CHAT_ID }}
          REPLAY_DAY: ${{ github.event_name == 'workflow_dispatch' && inputs.day || '' }}
        run: |
          pip install -q -r requirements.txt
          if [ -n "$REPLAY_DAY" ]; then
            python -m newsbot.deal_bot --day "$REPLAY_DAY"
          else
            python -m newsbot.deal_bot --once
          fi

      # Each run is a fresh machine. The seen-list has to come back with the
      # repository or the next run would send the same filings again. The
      # heartbeat changes once a day so GitHub does not disable the schedule
      # after 60 days without other commits.
      - name: Persist seen deals
        run: |
          date -u +%Y-%m-%d > newsbot/state/heartbeat.txt
          if [ -n "$(git status --porcelain newsbot/state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add newsbot/state
            git commit -m "Deal bot state: $(date -u +%Y-%m-%d\ %H:%M) UTC [skip ci]"
            for attempt in 1 2 3; do
              git pull --rebase --autostash -q && git push -q && break
              sleep 5
            done
          fi
